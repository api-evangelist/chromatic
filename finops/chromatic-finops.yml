meters:
- name: subscription
  description: Fixed monthly plan fee (Starter $179, Pro $399) bundling an included snapshot allowance.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: snapshots
  description: Captured snapshots (one image per story, per browser, per viewport); billed as overage above the plan allowance.
  unit: snapshots
  aggregation: sum
  dimensions:
  - account
  - project
  - browser
- name: turbosnap_savings
  description: Snapshots skipped by TurboSnap change detection, reducing billable snapshot volume.
  unit: snapshots
  aggregation: sum
  dimensions:
  - account
  - project
principles:
- name: Visibility
  description: Track snapshots per project, browser, and viewport, and monitor monthly usage against the plan allowance to anticipate overage.
- name: Allocation
  description: Split Chromatic projects per app/team so snapshot usage and overage map to internal cost centers.
- name: Optimization
  description: Enable TurboSnap to skip unchanged stories, trim redundant browsers/viewports, and gate visual tests to meaningful branches/PRs to reduce snapshot volume.
- name: Accountability
  description: Assign project owners and review snapshot burn against the plan allowance each billing cycle before overage accrues.
