description: >-
  FinOps view of Chromatic spend. Chromatic is a SaaS visual testing platform billed
  on a subscription plus snapshot-usage model: each tier bundles a monthly snapshot
  allowance and cross-browser scope, and snapshots consumed above the allowance are
  billed as overage (about $0.008 per snapshot on Starter and Pro). The primary cost
  driver is snapshot volume, which is the product of stories tested, browsers, and
  viewports per build multiplied by build frequency in CI. TurboSnap change detection
  is the main lever to cut cost by only snapshotting changed stories.
notes: >-
  Snapshot overage rate and included allowances captured from chromatic.com/pricing
  on 2026-07-11; verify during reconciliation. Enterprise pricing is custom.
