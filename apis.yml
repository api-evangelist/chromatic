    type: Documentation
  - url: graphql/chromatic-public-schema.graphql
    type: GraphQL
  - url: graphql/chromatic-graphql.md
    type: GraphQL
  - url: collections/chromatic.opencollection.json
    type: OpenCollection
  - url: collections/chromatic.postman_collection.json
    type: PostmanCollection
  description: Read the published Storybook and its structure. The `storybook(url)`
    query and the Story and Component node types expose the components and stories
    captured in a build, their CSF story IDs, test parameters, viewport/modes, and
    canvas URLs - the mapping between a published Storybook and the tests Chromatic
    runs against it.
