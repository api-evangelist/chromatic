apis:
- aid: chromatic:chromatic-builds-api
  name: Chromatic Builds API
  tags:
  - Visual Testing
  - Visual Regression
  - Builds
  - Snapshots
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.chromatic.com/docs/cli/
  baseURL: https://index.chromatic.com/graphql
  properties:
  - url: https://www.chromatic.com/docs/cli/
    type: Documentation
  - url: graphql/chromatic-public-schema.graphql
    type: GraphQL
  - url: graphql/chromatic-graphql.md
    type: GraphQL
  - url: collections/chromatic.opencollection.json
    type: OpenCollection
  - url: collections/chromatic.postman_collection.json
    type: PostmanCollection
  description: Query builds produced by the Chromatic CLI - the `build(id)` and
    `project.lastBuild(...)` GraphQL fields expose build number, status
    (IN_PROGRESS, PASSED, PENDING, ACCEPTED, DENIED, BROKEN, FAILED), result,
    browsers, Git commit/branch/slug, component and story counts, published
    Storybook URLs, and snapshot capture timings. This is the surface the CLI and
    Storybook Visual Tests addon use to initialize and poll visual-testing builds.
- aid: chromatic:chromatic-tests-review-api
  name: Chromatic Tests and Review API
  tags:
  - Visual Testing
  - UI Testing
  - Tests
  - Review
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.chromatic.com/docs/review/
  baseURL: https://index.chromatic.com/graphql
  properties:
  - url: https://www.chromatic.com/docs/review/
    type: Documentation
  - url: graphql/chromatic-public-schema.graphql
    type: GraphQL
  - url: graphql/chromatic-graphql.md
    type: GraphQL
  - url: collections/chromatic.opencollection.json
    type: OpenCollection
  - url: collections/chromatic.postman_collection.json
    type: PostmanCollection
  description: Inspect and act on individual visual tests. A Test carries its status,
    result, baseline, and per-browser snapshot comparisons (TestComparison with
    base/head captures and pixel diffs). The `reviewTest` mutation accepts, denies,
    or resets visual changes, optionally batched across a story, component, or the
    whole build - the same accept/deny workflow exposed in the Chromatic UI.
- aid: chromatic:chromatic-projects-accounts-api
  name: Chromatic Projects and Accounts API
  tags:
  - Projects
  - Accounts
  - Tokens
  - UI Testing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.chromatic.com/docs/setup/
  baseURL: https://index.chromatic.com/graphql
  properties:
  - url: https://www.chromatic.com/docs/setup/
    type: Documentation
  - url: graphql/chromatic-public-schema.graphql
    type: GraphQL
  - url: graphql/chromatic-graphql.md
    type: GraphQL
  - url: collections/chromatic.opencollection.json
    type: OpenCollection
  - url: collections/chromatic.postman_collection.json
    type: PostmanCollection
  description: Resolve project and account context. The `project(id)` field returns
    the project name, enabled features (uiReview, uiTests), branch names, project
    token, and manage/web URLs; `account(id)` and `viewer` expose account name,
    subscription status, and project lists. The `createCLIToken` mutation mints a
    short-lived CLI token from a project ID for authenticating build uploads.
- aid: chromatic:chromatic-storybook-stories-api
  name: Chromatic Storybook and Stories API
  tags:
  - Storybook
  - Stories
  - Components
  - Visual Testing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.chromatic.com/docs/storybook/
  baseURL: https://index.chromatic.com/graphql
  properties:
