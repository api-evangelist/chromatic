name: Chromatic
kind: company
description: Chromatic is a cloud visual testing and UI review platform built by the
  maintainers of Storybook. It captures snapshots of components and pages across
  cloud browsers, then compares each new snapshot to a stored baseline to catch
  visual regressions in appearance, layout, fonts, and color. Chromatic runs visual
  tests, interaction tests, and accessibility (axe) tests against Storybook,
  Playwright, and Cypress, with UI Review, TurboSnap change detection, and Git/CI
  integration. Its primary developer surface is the Chromatic CLI, which uploads
  builds and drives testing over a documented public GraphQL API at
  index.chromatic.com used by the CLI and the Storybook Visual Tests addon.
